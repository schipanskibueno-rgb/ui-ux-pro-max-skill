<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Área da Empresa – Vitrine Castro</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<style>
:root{--azul:#0E1428;--azul2:#1F2B57;--ouro:#D4A537;--txt:#0b1a45;--cinza:#4a5578;--verde:#13a049;--verm:#d9141a;--creme:#FAF6EC}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:Poppins,system-ui,sans-serif;background:#e9e3d3;color:var(--txt);line-height:1.4}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--creme);padding-bottom:40px}
header{background:#000;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;border-radius:0 0 24px 24px;display:flex;align-items:center;gap:10px}
header .v{font-family:Montserrat,Poppins,sans-serif;font-size:1.4rem;font-weight:800}
header .c{font-family:Montserrat,Poppins,sans-serif;font-size:1.4rem;font-weight:800;color:var(--ouro)}
header small{display:block;color:#E8D9A8;font-size:.78rem;letter-spacing:1px}
header .sair{margin-left:auto;background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:12px;min-height:44px;padding:0 14px;font-weight:600;cursor:pointer}
main{padding:16px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 3px 12px rgba(0,0,0,.07);margin-bottom:14px}
h2{font-size:1.25rem;margin-bottom:6px}
h3{font-size:1.05rem}
p.sub{color:var(--cinza);font-size:.92rem}
label{display:block;font-size:.9rem;font-weight:600;margin:12px 0 5px}
.inp{width:100%;border:2px solid #d9cfb3;border-radius:12px;padding:10px 14px;min-height:50px;font-size:1rem;background:#fff;color:var(--txt);outline:0}
.inp:focus{border-color:var(--azul2)}
textarea.inp{min-height:90px;resize:vertical}
.ajuda{font-size:.8rem;color:var(--cinza);margin-top:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;background:var(--azul);color:#fff;border:0;border-radius:14px;min-height:52px;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none}
.btn.ouro{background:linear-gradient(#E9C766,#C9952A);color:var(--azul)}
.btn.claro{background:#efe8d4;color:var(--txt)}
.btn.verm{background:#fde4e4;color:#a30d12}
.btn:disabled{opacity:.6;cursor:wait}
.linha{display:flex;gap:8px}.linha>*{flex:1}
.abas{display:flex;background:#efe8d4;border-radius:14px;padding:4px;margin-bottom:6px}
.abas button{flex:1;border:0;background:none;min-height:46px;border-radius:10px;font-weight:700;font-size:.95rem;color:var(--txt);cursor:pointer}
.abas button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.status{display:inline-block;border-radius:20px;padding:4px 12px;font-size:.8rem;font-weight:700}
.status.ok{background:#dff5e7;color:#0d6b31}.status.pend{background:#fff3cd;color:#7a5a00}.status.pausa{background:#eee;color:#555}
.empresa-top{display:flex;gap:12px;align-items:center}
.logo{width:64px;height:64px;border-radius:14px;background:var(--azul2);overflow:hidden;flex-shrink:0;display:grid;place-items:center;color:var(--ouro);font-size:1.6rem}
.logo img{width:100%;height:100%;object-fit:cover}
.oferta{display:flex;gap:12px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:10px}
.oferta .ft{width:96px;height:96px;border-radius:12px;background:var(--azul2);overflow:hidden;flex-shrink:0;display:grid;place-items:center;font-size:2rem}
.oferta .ft img{width:100%;height:100%;object-fit:cover}
.oferta .tx{flex:1;min-width:0}
.oferta b{display:block;font-size:1rem}
.oferta .tag{display:inline-block;background:linear-gradient(#E9C766,#C9952A);color:var(--azul);font-weight:800;border-radius:8px;padding:2px 10px;font-size:.9rem;margin:4px 0}
.oferta .acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mini{border:0;border-radius:10px;min-height:40px;padding:0 12px;font-weight:600;font-size:.85rem;cursor:pointer;background:#efe8d4;color:var(--txt)}
.mini.az{background:var(--azul);color:#fff}.mini.vm{background:#fde4e4;color:#a30d12}.mini.ou{background:var(--ouro);color:var(--azul)}
.previa{margin-top:8px;border-radius:14px;overflow:hidden;background:#efe8d4;aspect-ratio:16/10;display:grid;place-items:center;color:var(--cinza);font-size:.9rem;text-align:center}
.previa img{width:100%;height:100%;object-fit:cover}
.foto-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed #c9b98a;border-radius:14px;min-height:56px;font-weight:700;color:var(--txt);cursor:pointer;background:#fffaf0;margin-top:8px}
.foto-btn input,.arquivo{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.vazio{text-align:center;color:var(--cinza);padding:24px 8px}
.vazio .e{font-size:2.6rem;display:block}
.aviso{background:#fff6dc;border:1.5px solid #e6cf8d;border-radius:14px;padding:12px;font-size:.92rem;margin-bottom:14px}
.erro{background:#fde4e4;border:1.5px solid #f2b3b5;color:#7a0b0f;border-radius:12px;padding:10px 12px;font-size:.9rem;margin-top:10px;display:none}
.modal{position:fixed;inset:0;background:rgba(5,15,50,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.fechar{display:flex;align-items:center;gap:6px;margin-left:auto;background:#efe8d4;border:0;border-radius:30px;padding:0 16px;min-height:44px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--azul);color:#fff;padding:12px 18px;border-radius:30px;font-size:.95rem;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1}
.adm h3{margin:14px 0 8px}
.adm .item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0e8d2;flex-wrap:wrap}
.adm .item .n{flex:1;min-width:140px}
.adm select{min-height:40px;border-radius:10px;border:1.5px solid #d9cfb3;padding:0 8px}
.escondido{display:none}
/* ===== POSTAR (estilo Instagram) ===== */
.postar{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:0;border-radius:18px;padding:14px;box-shadow:0 3px 12px rgba(0,0,0,.07);margin-bottom:14px;text-align:left;cursor:pointer;color:var(--txt)}
.postar .mais{width:62px;height:62px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:2.2rem;font-weight:400;color:#fff;background:linear-gradient(135deg,#E9C766,#C9952A 55%,#0E1428);box-shadow:0 0 0 3px #fff,0 0 0 5px #D4A537}
.postar b{display:block;font-size:1.15rem}.postar small{color:var(--cinza);font-size:.88rem}
.demo-aviso{background:#000;color:#F3E3B5;border-radius:14px;padding:10px 14px;font-size:.85rem;margin-bottom:14px}
.demo-aviso b{color:#D4A537}
.perfil-loja{display:flex;align-items:center;gap:14px}
.perfil-loja .logo{width:76px;height:76px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 5px #D4A537}
.nums{display:flex;gap:18px;margin-top:6px;font-size:.85rem;color:var(--cinza)}.nums b{display:block;color:var(--txt);font-size:1.1rem}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:14px;overflow:hidden}
.grade button{position:relative;aspect-ratio:1/1;border:0;padding:0;background:var(--azul2);overflow:hidden;cursor:pointer;display:grid;place-items:center;font-size:2rem}
.grade img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grade .t{position:absolute;left:4px;right:4px;bottom:4px;background:linear-gradient(#E9C766,#C9952A);color:#0E1428;font-weight:800;font-size:.72rem;border-radius:6px;padding:2px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grade .st{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.75);color:#fff;font-size:.66rem;font-weight:700;border-radius:10px;padding:2px 7px}
.grade .st.ok{background:#13a049}
/* compositor */
.comp-foto{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:#000;display:grid;place-items:center;margin-top:10px}
.comp-foto img{width:100%;height:100%;object-fit:cover}
.comp-foto .vazio-foto{color:#F3E3B5;text-align:center;font-weight:600;padding:12px;width:100%;height:100%;display:grid;place-content:center;cursor:pointer;margin:0}
.comp-foto .carregando{color:#F3E3B5;font-weight:700}
.comp-foto .vazio-foto span{display:block;font-size:2.6rem}
.comp-foto .trocar{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:20px;padding:0 14px;min-height:44px;font-weight:700;cursor:pointer;display:flex;align-items:center;margin:0;font-size:.95rem}
.passo-t{font-weight:800;font-size:1.02rem;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.passo-t i{font-style:normal;background:var(--azul);color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid #d9cfb3;background:#fff;color:var(--txt);border-radius:30px;min-height:44px;padding:0 14px;font-weight:700;font-size:.95rem;cursor:pointer}
.ban-opc{display:flex;gap:10px;align-items:flex-start;font-weight:700;margin:0;cursor:pointer}
.ban-opc input{width:24px;height:24px;flex-shrink:0;margin-top:2px;accent-color:#C9952A}
.selo-p{background:#0E1428;color:#D4A537;font-size:.7rem;font-weight:800;border-radius:20px;padding:3px 9px;letter-spacing:.5px}
.pban{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/10;background:#0E1428;margin:10px auto 0;max-width:300px;border:2px solid #D4A537}
.pban img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pban .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,20,40,.95),rgba(14,20,40,.6) 55%,rgba(14,20,40,0))}
.pban .tx{position:absolute;left:12px;top:10px;bottom:10px;width:65%;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.pban .nm{font-weight:800;font-size:.9rem}.pban .tp{font-size:.62rem;color:#F3E3B5;letter-spacing:1px;font-weight:700}
.pban .of{font-weight:800;font-size:1.25rem;color:#E9C766;line-height:1}
.pban .ct{align-self:flex-start;background:linear-gradient(#E9C766,#C9952A);color:#0E1428;font-weight:800;font-size:.7rem;border-radius:20px;padding:4px 10px}
/* ===== página para empresas que querem participar ===== */
.lp-hero{background:#000;color:#fff;border-radius:22px;padding:22px 18px;text-align:center;border:1.5px solid #D4A537;margin-bottom:14px}
.lp-hero img{width:84px;height:84px;border-radius:20px}
.lp-hero h2{font-size:1.45rem;margin:10px 0 6px;line-height:1.25}.lp-hero h2 span{color:#D4A537}
.lp-hero p{color:#E8D9A8;font-size:.98rem}
.lp-passos{display:grid;gap:10px}
.lp-passos div{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.lp-passos b{display:block}.lp-passos small{color:var(--cinza)}
.lp-passos i{font-style:normal;width:44px;height:44px;border-radius:50%;background:linear-gradient(#E9C766,#C9952A);display:grid;place-items:center;font-size:1.3rem;flex-shrink:0}
.lp-ben{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lp-ben div{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);font-size:.88rem}
.lp-ben b{display:block;font-size:1rem;margin:4px 0 2px}
.lp-plano{background:#fff;border:2px solid #efe6cc;border-radius:18px;padding:14px;margin-bottom:10px;position:relative}
.lp-plano.dest{border-color:#D4A537}
.lp-plano .selo{position:absolute;top:-11px;right:14px;background:#D4A537;color:#0E1428;font-size:.7rem;font-weight:800;border-radius:20px;padding:3px 10px}
.lp-plano .preco{font-family:"Playfair Display",serif;font-size:1.7rem;font-weight:700;color:var(--ink-ouro,#7A6531)}
.lp-plano .preco small{font-family:Poppins,sans-serif;font-size:.8rem;color:var(--cinza)}
.lp-plano ul{list-style:none;margin-top:4px}.lp-plano li{font-size:.9rem;padding:2px 0}.lp-plano li:before{content:"✓ ";color:#13a049;font-weight:800}
.lp-faq details{background:#fff;border-radius:14px;padding:0 14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.lp-faq summary{cursor:pointer;font-weight:700;min-height:52px;display:flex;align-items:center}
.lp-faq p{padding:0 0 12px;color:var(--cinza);font-size:.92rem}
.lp-cta{position:sticky;bottom:0;background:linear-gradient(transparent,var(--creme) 30%);padding:14px 0 calc(8px + env(safe-area-inset-bottom))}
.lp-t{font-size:1.15rem;margin:22px 2px 10px}
/* passos do cadastro */
.prog{display:flex;gap:6px;margin-bottom:14px}
.prog div{flex:1;text-align:center;font-size:.72rem;font-weight:700;color:var(--cinza)}
.prog div:before{content:"";display:block;height:6px;border-radius:4px;background:#e6dcc0;margin-bottom:5px}
.prog div.on{color:#0E1428}.prog div.on:before{background:linear-gradient(90deg,#E9C766,#C9952A)}
.opc-plano{display:flex;gap:10px;align-items:flex-start;border:2px solid #e6dcc0;border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-weight:600}
.opc-plano:has(input:checked){border-color:#C9952A;background:#fffaf0}
.opc-plano input{width:22px;height:22px;accent-color:#C9952A;margin-top:2px;flex-shrink:0}
.opc-plano small{display:block;color:var(--cinza);font-weight:500}
/* abas e números */
.abas-p{display:flex;flex-wrap:wrap;gap:4px;background:#efe8d4;border-radius:14px;padding:4px;margin:4px 0 14px}
.abas-p button{flex:1 1 auto;border:0;background:none;min-height:46px;border-radius:10px;font-weight:700;font-size:.85rem;white-space:nowrap;padding:0 8px;color:var(--txt);cursor:pointer}
.abas-p button[aria-selected="true"]{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.kpi .n{font-size:1.6rem;font-weight:800;line-height:1.1;font-family:Montserrat,Poppins,sans-serif}
.kpi .r{font-size:.82rem;font-weight:700}.kpi small{display:block;color:var(--cinza);font-size:.75rem;margin-top:2px}
.kpi.ouro{background:linear-gradient(120deg,#0E1428,#1F2B57);color:#fff;border:1.5px solid #D4A537}.kpi.ouro small{color:#E8D9A8}.kpi.ouro .n{color:#E9C766}
.graf{display:flex;align-items:flex-end;gap:4px;height:120px;padding:8px 4px 0;border-bottom:1.5px solid #e6dcc0}
.graf div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%}
.graf i{display:block;width:100%;max-width:22px;border-radius:5px 5px 0 0;background:#c9d4ef;min-height:2px}
.graf i.c{background:linear-gradient(#E9C766,#C9952A)}
.graf-leg{display:flex;justify-content:space-between;font-size:.66rem;color:var(--cinza);margin-top:4px}
.oft-num{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.oft-num .ft{width:58px;height:58px;border-radius:10px;overflow:hidden;background:#1F2B57;display:grid;place-items:center;flex-shrink:0}
.oft-num .ft img{width:100%;height:100%;object-fit:cover}
.oft-num b{display:block;font-size:.95rem}
.oft-num .mini-n{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;color:var(--cinza);margin-top:2px}
.oft-num .mini-n span b{display:inline;color:var(--txt);font-size:.85rem}
.adm-linha{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;font:inherit;color:var(--txt);min-height:72px;transition:transform .12s ease}
.adm-linha:active{transform:scale(.99)}.adm-linha:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.adm-linha .logo{width:52px;height:52px;border-radius:12px;overflow:hidden;background:#1F2B57;display:grid;place-items:center;flex-shrink:0;font-size:1.5rem}
.adm-linha .logo img{width:100%;height:100%;object-fit:cover}
.adm-linha .meio{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.adm-linha .meio>b{font-size:1rem;overflow-wrap:anywhere}
.adm-linha .mini-n{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.8rem;color:var(--cinza)}.adm-linha .mini-n b{color:var(--txt)}
.adm-linha .chev{font-size:1.7rem;color:var(--cinza);line-height:1}
.selo-d{align-self:flex-start;font-size:.76rem;font-weight:700;border-radius:999px;padding:3px 10px}
.selo-d.vm,.diag.vm,.termo .t.vm{background:#fde4e4;color:#8a0e12}.selo-d.lj,.diag.lj,.termo .t.lj{background:#ffedd5;color:#8a3b06}
.selo-d.am,.diag.am,.termo .t.am{background:#fff3cd;color:#6b4e00}.selo-d.vd,.diag.vd,.termo .t.vd{background:#dff5e7;color:#0d5a2a}.selo-d.az,.diag.az{background:#e7ecfa;color:#1F2B57}
.termo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.termo .t{border:0;border-radius:14px;padding:10px 12px;text-align:left;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;min-height:68px}
.termo .t b{display:block;font-size:1.5rem;line-height:1.1;font-family:Montserrat,Poppins,sans-serif}
.diag{border-radius:16px;padding:14px 16px;margin-top:12px}.diag .dt{font-weight:800;font-size:1.15rem;margin-bottom:4px}
.diag ul{margin:6px 0 0 18px}.diag li{margin:4px 0}
.tend{font-size:.72rem;font-weight:700;margin-left:4px;color:var(--cinza);white-space:nowrap}.tend.up{color:#0d7a3a}.tend.dn{color:#b0141a}
.funil{margin-top:10px}.funil .fl{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;margin-bottom:4px}.funil .fl small{color:var(--cinza);font-weight:600}
.funil .fb{height:12px;background:#f1ead6;border-radius:99px;overflow:hidden}.funil .fb i{display:block;height:100%;background:linear-gradient(90deg,#1F2B57,#3d5299);border-radius:99px}
.res-ok{background:#dff5e7;color:#0d6b31;border-radius:14px;padding:14px;text-align:center;font-weight:700;margin-top:12px}
.dias-sem{display:flex;gap:4px;flex-wrap:wrap}
.dias-sem label{margin:0;position:relative}
.dias-sem input{position:absolute;opacity:0}
.dias-sem span{display:grid;place-items:center;min-width:44px;min-height:44px;border:2px solid #d9cfb3;border-radius:12px;font-weight:700;font-size:.85rem;background:#fff;cursor:pointer}
.dias-sem input:checked+span{background:#0E1428;color:#D4A537;border-color:#0E1428}
.dias-sem input:focus-visible+span{outline:3px solid var(--ouro);outline-offset:2px}
.precos-in{display:flex;gap:8px;align-items:flex-end}.precos-in>div{flex:1}
.pcard .pr{font-size:.78rem;color:var(--cinza)}.pcard .pr b{color:#13a049;font-size:.9rem}
.chips button[aria-pressed="true"]{background:linear-gradient(#E9C766,#C9952A);border-color:#C9952A;color:#0E1428}
.cont{font-size:.78rem;color:var(--cinza);text-align:right;margin-top:3px}

<main id="main"><div class="vazio"><span class="e">⏳</span>Carregando…</div></main>

<div class="modal" id="modal" onclick="if(event.target===this)fechar()" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const CATS=[["vest","👕 Vestuário"],["alim","🍔 Alimentação"],["est","💆‍♀️ Estética"],["sau","🩺 Saúde"],["barb","💈 Barbearia"],["pet","🐶 Pet"],["acad","🏋️ Academia"],["auto","🚗 Automotivo"],["merc","🛒 Mercado"],["const","🧱 Material de construção"]];
const RAMOS=["Vestuário","Alimentação","Estética","Saúde","Barbearia","Pet","Academia","Automotivo","Mercado","Material de construção","Outro"];
const RAMO_CAT={"Vestuário":"vest","Alimentação":"alim","Estética":"est","Saúde":"sau","Barbearia":"barb","Pet":"pet","Academia":"acad","Automotivo":"auto","Mercado":"merc","Material de construção":"const"};
const PLANOS={basico:{nome:"Básico",lim:1},destaque:{nome:"Destaque",lim:3},premium:{nome:"Premium",lim:"ilimitadas"}};
// Botões prontos para o "Qual é a oferta?" e o "Até quando?"
const OFERTAS_PRONTAS=["10% OFF","20% OFF","30% OFF","50% OFF","Leve 2, pague 1","Brinde na compra","Frete grátis"];
const PRAZOS=[["Hoje",0],["3 dias",3],["1 semana",7],["15 dias",15],["1 mês",30],["Sem prazo",null]];
const EXEMPLOS={"Vestuário":"Ex: Peças da nova coleção com desconto. Corra que é por pouco tempo!","Alimentação":"Ex: Pizza grande de qualquer sabor, de segunda a quinta.","Estética":"Ex: Escova + hidratação com horário marcado.","Saúde":"Ex: Desconto em perfumaria e dermocosméticos.","Barbearia":"Ex: Corte + barba pelo preço do corte.","Pet":"Ex: Banho e tosa para cães de pequeno porte.","Academia":"Ex: Primeira mensalidade com desconto.","Automotivo":"Ex: Troca de óleo + filtro com desconto."};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const seguro=u=>/^(https:\/\/|data:image\/)/.test(String(u||""))?u:"";
const hojeISO=(d=0)=>{const t=new Date();t.setDate(t.getDate()+d);return t.toLocaleDateString("sv-SE")};
const dataBR=d=>d?new Date(d+"T00:00:00").toLocaleDateString("pt-BR"):"";
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),3200)}
function fechar(){$("#modal").classList.remove("on");document.body.style.overflow=""}
function abrirSheet(h){$("#sheet").innerHTML=`<button class="fechar" onclick="fechar()">Fechar ✕</button>`+h;$("#modal").classList.add("on");document.body.style.overflow="hidden";$("#sheet").scrollTop=0}
function traduzErro(e){const m=(e&&e.message)||String(e);
  if(/Invalid login/i.test(m))return"E-mail ou senha incorretos.";
  if(/already registered/i.test(m))return"Este e-mail já tem conta. Use a aba Entrar.";
  if(/Email not confirmed/i.test(m))return"Confirme seu e-mail: abra a mensagem que enviamos e clique no link.";
  if(/at least 6/i.test(m))return"A senha precisa ter pelo menos 6 caracteres.";
  if(/quota|exceeded/i.test(m))return"O espaço do modo demonstração acabou. Apague uma oferta para postar outra.";
  if(/Failed to fetch|NetworkError/i.test(m))return"Sem internet. Tente de novo.";
  if(/até 20 brindes/i.test(m))return"Cada loja pode ter até 20 brindes.";
  return m}

/* ===== MODO: banco real (Supabase) ou DEMONSTRAÇÃO (fica só neste celular) ===== */
const DEMO=!(window.CONFIG&&CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY);
const db=DEMO?null:supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
let user=null,empresa=null,ofertas=[],admin=false;

// ===== LOGIN =====
function telaLogin(modo="entrar"){
  $("#btnSair").classList.add("escondido");
  $("#main").innerHTML=`${modo==="criar"?progresso(1):""}<div class="card">
   <h2>${modo==="criar"?"Crie sua conta de empresa":"Bem-vindo, lojista! 👋"}</h2><p class="sub">${modo==="criar"?"Passo 1 de 3: e-mail e senha para entrar na sua área.":"Entre para postar suas promoções e ver seus resultados."}</p>
   <div class="abas" style="margin-top:14px"><button class="${modo==="entrar"?"on":""}" onclick="telaLogin('entrar')">Entrar</button><button class="${modo==="criar"?"on":""}" onclick="telaLogin('criar')">Criar conta</button></div>
   <form onsubmit="entrar(event,'${modo}')">
    <label for="lEmail">E-mail</label><input class="inp" id="lEmail" type="email" autocomplete="email" required>
    <label for="lSenha">Senha</label><input class="inp" id="lSenha" type="password" autocomplete="${modo==="criar"?"new-password":"current-password"}" minlength="6" required>
    ${modo==="criar"?'<p class="ajuda">Mínimo de 6 caracteres.</p>':""}
    <button class="btn" id="btnEntrar">${modo==="criar"?"Criar minha conta":"Entrar"}</button>
    <div class="erro" id="lErro"></div>
   </form>
   ${modo==="entrar"?`<button class="btn claro" onclick="esqueci()">Esqueci minha senha</button>`:""}
  </div><button class="btn claro" onclick="telaBoasVindas()">← Conhecer o Vitrine para empresas</button>`;
}
async function entrar(ev,modo){ev.preventDefault();const email=$("#lEmail").value.trim(),senha=$("#lSenha").value,b=$("#btnEntrar");b.disabled=true;$("#lErro").style.display="none";
  try{
    if(modo==="criar"){
      const {data,error}=await db.auth.signUp({email,password:senha,options:{emailRedirectTo:location.href.split("#")[0]}});if(error)throw error;
      if(!data.session){$("#main").innerHTML=`<div class="card"><h2>📧 Confirme seu e-mail</h2><p class="sub">Enviamos um link para <b>${esc(email)}</b>. Abra o e-mail, clique no link e depois volte aqui para entrar.</p><button class="btn" onclick="telaLogin('entrar')">Já confirmei, entrar</button></div>`;return}
    }else{const {error}=await db.auth.signInWithPassword({email,password:senha});if(error)throw error}
    await iniciar();
  }catch(e){$("#lErro").textContent=traduzErro(e);$("#lErro").style.display="block"}finally{b.disabled=false}
}
async function esqueci(){const email=($("#lEmail").value||"").trim();if(!email){$("#lErro").textContent="Digite seu e-mail acima primeiro.";$("#lErro").style.display="block";return}
  const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href.split("#")[0]});toast(error?traduzErro(error):"Enviamos um link para criar uma nova senha.")}
async function sair(){if(DEMO){if(!confirm("Apagar a loja e as ofertas de demonstração deste celular?"))return;localStorage.removeItem("vc_demo_emp");localStorage.removeItem("vc_demo_ofertas");empresa=null;ofertas=[];telaCadastroEmpresa();return}
  await db.auth.signOut();user=null;empresa=null;telaLogin()}

function telaSouAdmin(){$("#main").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3rem" aria-hidden="true">👑</div><h2>Você é o administrador</h2>
  <p class="sub">A administração fica em uma página separada, na coroa 👑 do topo do app.</p><a class="btn ouro" href="admin.html">Abrir a Administração</a>
  <button class="btn claro" onclick="telaCadastroEmpresa()">🏪 Cadastrar uma loja minha também</button></div>`}
// ===== INÍCIO =====
async function iniciar(){
  if(DEMO){empresa=store.get("vc_demo_emp",null);$("#btnSair").classList.toggle("escondido",!empresa);$("#btnSair").textContent="Recomeçar";
    if(!empresa){location.hash==="#participar"?telaCadastroEmpresa():telaBoasVindas();return}await carregarOfertas();telaPainel();return}
  const {data:{session}}=await db.auth.getSession();
  if(!session){location.hash==="#entrar"?telaLogin("entrar"):location.hash==="#participar"?telaLogin("criar"):telaBoasVindas();return}
  user=session.user;$("#btnSair").classList.remove("escondido");
  const [{data:emp},{data:adm}]=await Promise.all([db.from("empresas").select("*").eq("dono",user.id).maybeSingle(),db.from("admins").select("user_id").eq("user_id",user.id).maybeSingle()]);
  empresa=emp;admin=!!adm;
  if(!empresa){admin?telaSouAdmin():telaCadastroEmpresa();return}
  await carregarOfertas();telaPainel();
}
async function carregarOfertas(){
  if(DEMO){ofertas=store.get("vc_demo_ofertas",[]);return}
  const {data,error}=await db.from("ofertas").select("*").eq("empresa_id",empresa.id).order("criado_em",{ascending:false});if(error)toast(traduzErro(error));ofertas=data||[]}

// ===== FOTOS: reduz e recorta no formato do app (16:10) antes de enviar =====
function carregarImagem(file){return new Promise((res,rej)=>{if(file.type&&!/^image\//.test(file.type))return rej(new Error("Escolha uma foto."));const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(new Error(/heic|heif/i.test(file.type+file.name)?"Essa foto está no formato HEIC do iPhone. Tire um print da foto e envie o print, ou no iPhone: Ajustes > Câmera > Formatos > Mais Compatível.":"Não foi possível abrir essa foto. Tente outra."));img.src=URL.createObjectURL(file)})}
async function prepararFoto(file,{larg=1200,prop=16/10}={}){
  const img=await carregarImagem(file);let sw=img.width,sh=img.height,sx=0,sy=0;
  if(sw/sh>prop){sw=Math.round(sh*prop);sx=Math.round((img.width-sw)/2)}else{sh=Math.round(sw/prop);sy=Math.round((img.height-sh)/2)}
  const w=Math.min(larg,sw),h=Math.round(w/prop),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,w,h);URL.revokeObjectURL(img.src);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Não foi possível ler a foto")),"image/jpeg",DEMO?.72:.82));
}
const blobParaDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function enviarFoto(blob){
  if(DEMO)return blobParaDataURL(blob);
  const nome=`${user.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
  const {error}=await db.storage.from("fotos").upload(nome,blob,{contentType:"image/jpeg",upsert:false});if(error)throw error;
  return db.storage.from("fotos").getPublicUrl(nome).data.publicUrl}
function mostrarPrevia(input,alvo){const f=input.files[0];if(!f)return;const u=URL.createObjectURL(f);$(alvo).innerHTML=`<img src="${u}" alt="Prévia da foto">`}

// ===== CADASTRO DA EMPRESA =====
function formEmpresa(e={}){return `
  <label for="eNome">Nome da loja</label><input class="inp" id="eNome" required maxlength="80" value="${esc(e.nome)}" placeholder="Ex: VS Store">
  <label for="eRamo">Ramo</label><select class="inp" id="eRamo">${RAMOS.map(r=>`<option ${r===e.ramo?"selected":""}>${r}</option>`).join("")}</select>
  <label for="eWhats">WhatsApp da loja</label><input class="inp" id="eWhats" inputmode="tel" maxlength="20" value="${esc(e.whatsapp)}" placeholder="(42) 9 9999-9999">
  <p class="ajuda">Os clientes vão falar com você por este número.</p>
  <fieldset style="border:0;margin-top:12px"><legend style="font-size:.9rem;font-weight:600;margin-bottom:5px">Horário de funcionamento</legend>
   <div class="linha"><div><label for="eAbre" style="margin-top:0">Abre às</label><input class="inp" id="eAbre" type="time" value="${esc(String(e.abre||"").slice(0,5))}"></div><div><label for="eFecha" style="margin-top:0">Fecha às</label><input class="inp" id="eFecha" type="time" value="${esc(String(e.fecha||"").slice(0,5))}"></div></div>
   <p class="ajuda" style="margin:8px 0 4px">Dias que abre:</p>${diasCheck("eDias",e.dias_func||"1,2,3,4,5,6")}
   <p class="ajuda">Com isso o app mostra “🟢 Aberto agora” ou “Fechado – abre às…”.</p></fieldset>
  <label for="eInsta">Instagram da loja (opcional)</label><input class="inp" id="eInsta" maxlength="40" value="${esc(e.instagram)}" placeholder="Ex: pizzariadoze (sem o @)">
  <label for="eEnd">Endereço</label><input class="inp" id="eEnd" maxlength="150" value="${esc(e.endereco)}" placeholder="Rua, número – bairro">
  <label>Logo da loja</label><div class="previa" id="eLogoPrev" style="aspect-ratio:1/1;width:120px">${seguro(e.logo_url)?`<img src="${esc(e.logo_url)}" alt="Logo">`:"Sem logo"}</div>
  <label class="foto-btn">📷 Escolher logo<input type="file" accept="image/*" id="eLogo" onchange="mostrarPrevia(this,'#eLogoPrev')"></label>
  <div class="erro" id="eErro"></div>`}
function telaCadastroEmpresa(){const plano=store.get("vc_plano_desejado","basico");
  $("#main").innerHTML=`${DEMO?avisoDemo():""}${progresso(2)}<div class="card"><h2>🏪 Dados da sua loja</h2><p class="sub">${DEMO?"":"Passo 2 de 3. "}Leva 1 minuto. É assim que os clientes vão ver sua loja.</p>
  <form onsubmit="salvarEmpresa(event)">${formEmpresa()}
   <label style="margin-top:16px">Qual plano você quer?</label>
   ${PLANOS_VENDA.map(p=>`<label class="opc-plano"><input type="radio" name="ePlano" value="${p.id}" ${p.id===plano?"checked":""}><span>${p.nome} – ${p.preco}/mês<small>${p.resumo}</small></span></label>`).join("")}
   <p class="ajuda">🎁 As 20 primeiras lojas ganham 3 meses grátis. O plano é ativado depois que combinarmos pelo WhatsApp.</p>
   <label class="opc-plano" style="margin-top:12px"><input type="checkbox" id="eTermos" required><span>Li e aceito os <a href="#" onclick="event.preventDefault();termosEmpresa()">termos para empresas</a><small>As ofertas são reais, o desconto é dado na loja e eu confirmo as compras feitas com cupom.</small></span></label>
   <button class="btn ouro" id="eBtn">Concluir cadastro</button></form></div><div id="admBox"></div>`}
async function salvarEmpresa(ev){ev.preventDefault();const b=$("#eBtn");b.disabled=true;$("#eErro").style.display="none";
  const primeiro=!empresa,planoEsc=(document.querySelector('input[name="ePlano"]:checked')||{}).value;if(planoEsc)store.set("vc_plano_desejado",planoEsc);
  try{
    const dados={nome:$("#eNome").value.trim(),ramo:$("#eRamo").value,whatsapp:$("#eWhats").value.trim(),endereco:$("#eEnd").value.trim(),
      abre:$("#eAbre").value||null,fecha:$("#eFecha").value||null,dias_func:diasLidos("eDias"),instagram:($("#eInsta").value||"").replace(/[^A-Za-z0-9._]/g,"").slice(0,40)||null};
    const f=$("#eLogo").files[0];if(f)dados.logo_url=await enviarFoto(await prepararFoto(f,{larg:400,prop:1}));
    if(DEMO){empresa={...(empresa||{id:"demo",aprovada:true,plano:"premium"}),...dados};store.set("vc_demo_emp",empresa)}
    else{const gravar=d=>(empresa?db.from("empresas").update(d).eq("id",empresa.id):db.from("empresas").insert(d)).select().single();
      let r=await gravar(dados);
      if(r.error&&/abre|fecha|dias_func|instagram|schema cache/i.test(r.error.message||"")){const {abre,fecha,dias_func,instagram,...base}=dados;r=await gravar(base);if(!r.error)toast("Loja salva. Para guardar horário e Instagram, rode a atualização do banco (supabase.sql).")}
      if(r.error)throw r.error;empresa=r.data}
    fechar();if(primeiro){telaSucessoCadastro();return}toast("✅ Dados salvos!");await iniciar();
  }catch(e){$("#eErro").textContent=traduzErro(e);$("#eErro").style.display="block"}finally{b.disabled=false}
}
function editarEmpresa(){abrirSheet(`<h2 style="margin-top:8px">Dados da loja</h2><form onsubmit="salvarEmpresa(event)">${formEmpresa(empresa)}<button class="btn" id="eBtn">Salvar</button></form>`)}

// ===== PAINEL (perfil da loja + grade de posts) =====
function avisoDemo(){return `<div class="demo-aviso"><b>Modo demonstração.</b> O que você postar fica só neste celular e aparece no app deste aparelho. Para valer para todos, preencha o config.js com o Supabase.</div>`}
function venceu(o){return o.validade&&new Date(o.validade+"T23:59:59")<new Date()}
let ABA="resultados";
function telaPainel(){
  const pl=PLANOS[empresa.plano]||PLANOS.basico,ativas=ofertas.filter(o=>o.ativa&&!venceu(o)).length;
  const whatsAdm=((window.CONFIG&&CONFIG.WHATSAPP)||"").replace(/\D/g,"");
  $("#main").innerHTML=`${DEMO?avisoDemo():""}
  ${empresa.aprovada?"":`<div class="aviso">⏳ <b>Sua loja está em análise.</b> Você já pode postar; as ofertas aparecem no app assim que a loja for aprovada.${whatsAdm?` <a href="https://wa.me/${whatsAdm}?text=${encodeURIComponent("Olá! Cadastrei a loja "+empresa.nome+" na Área da Empresa do Vitrine Castro.")}" target="_blank" rel="noopener">Avisar pelo WhatsApp</a>`:""}</div>`}
  <div class="card"><div class="perfil-loja"><div class="logo">${seguro(empresa.logo_url)?`<img src="${esc(empresa.logo_url)}" alt="">`:"🏪"}</div>
   <div style="flex:1;min-width:0"><h2 style="margin:0">${esc(empresa.nome)}</h2><span class="status ${empresa.aprovada?"ok":"pend"}">${empresa.aprovada?"✓ Aprovada":"Em análise"}</span>${DEMO?"":` <span class="status pausa">Plano ${pl.nome}</span>`}
    <div class="nums"><span><b>${ofertas.length}</b>posts</span><span><b>${ativas}</b>no ar</span>${DEMO?"":`<span><b>${pl.lim}</b>limite</span>`}</div></div></div>
   <button class="btn claro" onclick="editarEmpresa()">✏️ Editar perfil da loja</button></div>
  <button class="postar" onclick="novoPost()"><span class="mais" aria-hidden="true">+</span><span><b>Postar oferta</b><small>Escolha a foto, escreva e publique. Leva 30 segundos.</small></span></button>
  <div class="abas-p" role="tablist">${[["resultados","📊 Resultados"],["posts","📸 Meus posts"],["confirmar","✅ Confirmar compra"],["brindes","🎁 Brindes"],["plano","💼 Meu plano"]].map(([k,n])=>`<button role="tab" aria-selected="${ABA===k}" onclick="ABA='${k}';telaPainel()">${n}</button>`).join("")}</div>
  <div id="abaBox"></div>
  <div id="admBox"></div>`;
  (({resultados:abaResultados,posts:abaPosts,confirmar:abaConfirmar,brindes:abaBrindes,plano:abaPlano})[ABA]||abaResultados)();
}
function abaPosts(){

let _jsqr=null;
function carregarJsQR(){if(window.jsQR)return Promise.resolve();return _jsqr=_jsqr||new Promise((ok,er)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";s.integrity="sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx";s.crossOrigin="anonymous";s.onload=ok;s.onerror=()=>er(new Error("Não foi possível abrir o leitor de QR Code. Digite o código."));document.head.appendChild(s)})}
async function fotoQR(input){const f=input.files[0];input.value="";if(!f)return;$("#cRes").innerHTML=`<p class="sub" style="margin-top:10px">Lendo o QR Code…</p>`;
  try{const bmp=await createImageBitmap(f);let txt="";
    if("BarcodeDetector" in window){try{const r=await new BarcodeDetector({formats:["qr_code"]}).detect(bmp);if(r[0])txt=r[0].rawValue}catch(e){}}
    if(!txt){await carregarJsQR();const k=Math.min(1,1200/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*k),h=Math.round(bmp.height*k),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(bmp,0,0,w,h);const r=jsQR(x.getImageData(0,0,w,h).data,w,h);txt=r?r.data:""}
    const cod=extrairCodigo(txt);if(!cod)throw new Error("Não consegui ler o QR Code. Tente de novo com mais luz ou digite o código.");
    $("#cCod").value=cod;consultarCupom()}catch(err){$("#cRes").innerHTML=`<div class="erro" style="display:block">${esc(traduzErro(err))}</div>`}}
function demoCupom(cod){const cs=store.get("gira_cupons",[]),c=cs.find(x=>String(x.cod).toUpperCase()===cod);if(!c)return null;
  const oid=String(c.id).replace(/^d/,""),o=ofertas.find(x=>String(x.id)===oid);if(!o||!/^d/.test(String(c.id)))return null;
  const u=store.get("vc_demo_usados",{})[cod];return {titulo:o.titulo,oferta:oid,usado_em:u?u.em:null,valor:u?u.valor:null}}
async function consultarCupom(){const cod=extrairCodigo($("#cCod").value),box=$("#cRes");
  if(!cod){box.innerHTML=`<div class="erro" style="display:block">Digite o código. Cupom começa com VC- (ex.: VC-ABC12) e brinde com BR- (ex.: BR-ABC123).</div>`;return}

  box.innerHTML=`<p class="sub" style="margin-top:10px">Conferindo…</p>`;
  let r;
  if(DEMO)r=demoCupom(cod);
  else{const {data,error}=await db.rpc("consultar_cupom",{p_codigo:cod});if(error){box.innerHTML=`<div class="erro" style="display:block">${esc(traduzErro(error))}</div>`;return}r=data&&data.ok?data:null}
  if(!r){box.innerHTML=`<div class="erro" style="display:block">Esse código não é de uma oferta da sua loja. Confira com o cliente.</div>`;return}
  if(r.usado_em){box.innerHTML=`<div class="erro" style="display:block">Esse cupom já foi usado em ${new Date(r.usado_em).toLocaleDateString("pt-BR")}${r.valor?" (compra de "+fmtR(r.valor)+")":""}.</div>`;return}
  box.innerHTML=`<div class="card" style="border:2px solid #D4A537;margin-top:12px;box-shadow:none"><p class="sub">Cupom <b>${esc(cod)}</b> ✓ válido</p><h3>${esc(r.titulo)}</h3>
   <form onsubmit="event.preventDefault();confirmarCupom('${esc(cod)}')"><label for="cValor">Valor da compra (R$)</label><input class="inp" id="cValor" inputmode="decimal" required placeholder="Ex: 48,00">
   <button class="btn ouro" id="cBtn">✅ Confirmar compra</button></form></div>`;setTimeout(()=>{const i=$("#cValor");i&&i.focus()},60)}
async function confirmarCupom(cod){const v=parseFloat(String($("#cValor").value).replace(/\./g,"").replace(",","."))||0,b=$("#cBtn");
  if(!(v>0&&v<=50000)){toast("Digite o valor da compra");return}b.disabled=true;
  try{
    if(DEMO){const r=demoCupom(cod);if(!r||r.usado_em)throw new Error("Cupom inválido ou já usado.");const us=store.get("vc_demo_usados",{});us[cod]={em:new Date().toISOString(),valor:v};store.set("vc_demo_usados",us);
      const l=store.get("vc_demo_eventos",[]);l.push({oferta:r.oferta,tipo:"compra",dia:hojeISO(),valor:v,em:Date.now()});store.set("vc_demo_eventos",l)}
    let ganhos=Math.floor(v);
    if(!DEMO){const {data,error}=await db.rpc("confirmar_cupom",{p_codigo:cod,p_valor:Math.round(v*100)/100});if(error)throw error;if(!data||!data.ok)throw new Error((data&&data.motivo)||"Não foi possível confirmar.");ganhos=Number(data.pontos)||0}
    $("#cRes").innerHTML=`<div class="res-ok">✅ Compra de ${fmtR(v)} confirmada!<br><span style="font-weight:500">Ela já aparece em Resultados.${ganhos?` O cliente ganhou <b>${ganhos} pontos</b>.`:""}</span></div>`;$("#cCod").value="";
  }catch(err){toast(traduzErro(err));b.disabled=false}}


/* ===================================================================
   BRINDES: a loja escolhe o que dá em troca dos pontos do Vitrine
   =================================================================== */
async function carregarBrindes(){
  if(DEMO)return store.get("vc_demo_brindes",[]);
  const {data,error}=await db.from("brindes").select("*").eq("empresa_id",empresa.id).order("pontos");
  if(error)throw new Error(/does not exist|schema cache|relation/i.test(error.message)?"Para usar os brindes, o Vitrine precisa atualizar o banco (supabase.sql).":traduzErro(error));
  return data||[]}
async function abaBrindes(){const box=$("#abaBox");box.innerHTML=`<div class="vazio"><span class="e">⏳</span>Carregando brindes…</div>`;
  let l;try{l=await carregarBrindes()}catch(err){box.innerHTML=`<div class="aviso">${esc(err.message)}</div>`;return}
  box.innerHTML=`${empresa.aprovada||DEMO?"":`<div class="aviso">⏳ Seus brindes aparecem no app assim que a loja for aprovada.</div>`}
   <div class="card"><h2>🎁 Meus brindes</h2><p class="sub">Os clientes juntam pontos comprando nas lojas do Vitrine: <b>1 ponto por R$ 1</b>, só em compras confirmadas pelas lojas. Escolha o que a sua loja dá em troca. Quando alguém trocar, mostra um código <b>BR-</b> e você entrega na aba ✅ Confirmar compra.</p>
    <form onsubmit="event.preventDefault();salvarBrinde()">
     <label for="bNome">Brinde</label><input class="inp" id="bNome" maxlength="60" required placeholder="Ex: Pizza broto, Corte de cabelo, Café">
     <div class="linha"><div><label for="bPts">Custa quantos pontos?</label><input class="inp" id="bPts" type="number" inputmode="numeric" min="10" max="100000" step="1" required placeholder="Ex: 300"></div>
      <div><label for="bEst">Quantidade (opcional)</label><input class="inp" id="bEst" type="number" inputmode="numeric" min="1" max="100000" step="1" placeholder="Sem limite"></div></div>
     <p class="ajuda">Dica: 300 pontos = cliente que gastou uns R$ 300 nas lojas do Vitrine. Escolha um brinde que valha a visita.</p>
     <div class="erro" id="bErro"></div><button class="btn ouro" id="bBtn">➕ Cadastrar brinde</button></form></div>
   ${l.length?l.map(b=>`<div class="card" style="padding:14px;display:flex;gap:10px;align-items:center"><div style="flex:1;min-width:0"><b>${esc(b.nome)}</b><p class="ajuda" style="margin:2px 0 0">${Number(b.pontos)} pontos · ${b.estoque==null?"sem limite":b.estoque+" restante"+(b.estoque==1?"":"s")} · ${b.ativo?"✅ aparece no app":"⏸ pausado"}</p></div>
      <button class="mini" onclick="brindeAtivo('${esc(b.id)}',${!b.ativo})">${b.ativo?"Pausar":"Ativar"}</button><button class="mini vm" onclick="apagarBrinde('${esc(b.id)}')" aria-label="Apagar ${esc(b.nome)}">🗑</button></div>`).join("")
    :`<div class="vazio"><span class="e">🎁</span>Nenhum brinde ainda. Cadastre o primeiro acima.</div>`}`}
async function salvarBrinde(){const nome=$("#bNome").value.trim(),pts=Number($("#bPts").value),estS=$("#bEst").value.trim(),est=estS?Number(estS):null,er=$("#bErro"),b=$("#bBtn");
  const erro=m=>{er.textContent=m;er.style.display="block"};er.style.display="none";
  if(nome.length<2)return erro("Escreva o nome do brinde.");
  if(!Number.isInteger(pts)||pts<10||pts>100000)return erro("Os pontos precisam ser um número inteiro entre 10 e 100.000.");
  if(est!==null&&(!Number.isInteger(est)||est<1||est>100000))return erro("A quantidade precisa ser um número inteiro (ou deixe vazio).");
  b.disabled=true;
  try{if(DEMO){const l=store.get("vc_demo_brindes",[]);if(l.length>=20)throw new Error("Cada loja pode ter até 20 brindes.");l.push({id:"db"+Date.now().toString(36),nome,pontos:pts,estoque:est,ativo:true,loja:empresa.nome});store.set("vc_demo_brindes",l)}
    else{const {error}=await db.from("brindes").insert({empresa_id:empresa.id,nome,pontos:pts,estoque:est});if(error)throw error}
    toast("🎁 Brinde cadastrado!");abaBrindes()}catch(err){erro(traduzErro(err));b.disabled=false}}
async function brindeAtivo(id,ativo){
  if(DEMO){const l=store.get("vc_demo_brindes",[]),x=l.find(b=>b.id===id);if(x)x.ativo=ativo;store.set("vc_demo_brindes",l)}
  else{const {error}=await db.from("brindes").update({ativo}).eq("id",id);if(error){toast(traduzErro(error));return}}
  toast(ativo?"Brinde ativado":"Brinde pausado");abaBrindes()}
async function apagarBrinde(id){if(!confirm("Apagar este brinde? Trocas já feitas continuam valendo."))return;
  if(DEMO)store.set("vc_demo_brindes",store.get("vc_demo_brindes",[]).filter(b=>b.id!==id));
  else{const {error}=await db.from("brindes").delete().eq("id",id);if(error){toast(traduzErro(error));return}}
  toast("Brinde apagado");abaBrindes()}
/* entregar o brinde: o cliente mostra o código BR- (ou o QR Code) */
async function consultarResgate(cod){const box=$("#cRes");let r=null;
  if(DEMO){const x=store.get("vc_demo_resgates",[]).find(y=>y.codigo===cod&&y.empresa==="demo");if(x)r={brinde:x.brinde_nome,pontos:x.pontos,criado_em:x.criado_em,entregue_em:x.entregue_em,cancelado_em:x.cancelado_em}}
  else{const {data,error}=await db.rpc("consultar_resgate",{p_codigo:cod});if(error){box.innerHTML=`<div class="erro" style="display:block">${esc(traduzErro(error))}</div>`;return}if(data&&data.ok)r=data}
  if(!r){box.innerHTML=`<div class="erro" style="display:block">Esse código de brinde não é da sua loja. Confira com o cliente.</div>`;return}
  if(r.entregue_em){box.innerHTML=`<div class="erro" style="display:block">Esse brinde já foi entregue em ${new Date(r.entregue_em).toLocaleDateString("pt-BR")}.</div>`;return}
  if(r.cancelado_em){box.innerHTML=`<div class="erro" style="display:block">Essa troca foi cancelada e os pontos voltaram para o cliente.</div>`;return}
  box.innerHTML=`<div class="card" style="border:2px solid #D4A537;margin-top:12px;box-shadow:none"><p class="sub">Brinde <b>${esc(cod)}</b> ✓ válido</p><h3>🎁 ${esc(r.brinde)}</h3><p class="ajuda">${Number(r.pontos)} pontos · trocado em ${new Date(r.criado_em).toLocaleDateString("pt-BR")}</p>
   <button class="btn ouro" id="rBtn" onclick="entregarResgate('${esc(cod)}','entregar')">✅ Entregar brinde</button>
   <button class="btn claro" onclick="entregarResgate('${esc(cod)}','cancelar')">Cancelar e devolver os pontos</button></div>`}
async function entregarResgate(cod,acao){if(acao==="cancelar"&&!confirm("Cancelar esta troca e devolver os pontos ao cliente?"))return;
  const b=$("#rBtn");if(b)b.disabled=true;
  try{if(DEMO){const l=store.get("vc_demo_resgates",[]),x=l.find(y=>y.codigo===cod&&y.empresa==="demo");if(!x||x.entregue_em||x.cancelado_em)throw new Error("Código inválido ou já usado.");
      x[acao==="entregar"?"entregue_em":"cancelado_em"]=new Date().toISOString();store.set("vc_demo_resgates",l);
      if(acao==="cancelar"){const p=store.get("gira_pontos",{saldo:0,total:0,hist:[],brindes:[]});p.saldo+=x.pontos;p.hist.unshift({d:"Pontos devolvidos",v:x.pontos,em:Date.now()});store.set("gira_pontos",p);
        const bl=store.get("vc_demo_brindes",[]),bb=bl.find(z=>z.id===x.brinde_id);if(bb&&bb.estoque!=null){bb.estoque++;store.set("vc_demo_brindes",bl)}}}
    else{const {data,error}=await db.rpc("confirmar_resgate",{p_codigo:cod,p_acao:acao});if(error)throw error;if(!data||!data.ok)throw new Error((data&&data.motivo)||"Não foi possível concluir.")}
    $("#cRes").innerHTML=`<div class="res-ok">${acao==="entregar"?"🎁 Brinde entregue!":"Troca cancelada. Os pontos voltaram para o cliente."}</div>`;$("#cCod").value=""}
  catch(err){toast(traduzErro(err));if(b)b.disabled=false}}
/* ===================================================================
   MEU PLANO
   =================================================================== */
async function minhasMensalidades(){const box=$("#mensBox");if(!box)return;
  let l=[];if(DEMO)l=store.get("vc_demo_pagamentos",[]).filter(p=>p.tipo==="mensalidade"&&p.empresa_id==="demo").sort((a,b)=>String(b.referencia).localeCompare(String(a.referencia)));
  else{const {data,error}=await db.rpc("minhas_mensalidades");if(error){box.innerHTML="";return}l=data||[]}
  const mes=hojeISO().slice(0,7),M=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],nm=r=>M[+String(r).slice(5)-1]+"/"+String(r).slice(0,4);
  const pago=l.find(p=>p.referencia===mes);
  box.innerHTML=`<div class="card"><h3>💳 Minhas mensalidades</h3>
   <p style="margin-top:6px">${pago?`<span class="status ok">✓ ${nm(mes)} paga</span>`:`<span class="status pend">⏳ ${nm(mes)}: vence dia 10</span>`}</p>
   ${l.length?l.map(p=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid #f0e8d2;font-size:.9rem"><span>${nm(p.referencia)}<small style="display:block;color:var(--cinza)">pago em ${dataBR(String(p.pago_em).slice(0,10))}</small></span><b>${fmtR(p.valor)}</b></div>`).join(""):`<p class="ajuda">Nenhum pagamento registrado ainda. Assim que o Vitrine receber, ele aparece aqui.</p>`}</div>`}
function abaPlano(){const wa=((window.CONFIG&&CONFIG.WHATSAPP)||"").replace(/\D/g,""),atual=DEMO?"premium":empresa.plano;setTimeout(minhasMensalidades,0);
  $("#abaBox").innerHTML=`<div id="mensBox"></div><div class="card"><h2>💼 Meu plano</h2><p class="sub">${DEMO?"No modo demonstração todas as funções estão liberadas.":`Seu plano é o <b>${(PLANOS[atual]||{}).nome||atual}</b>. Para mudar, fale com a gente pelo WhatsApp.`}</p></div>
   ${PLANOS_VENDA.map(p=>`<div class="lp-plano ${p.id===atual?"dest":""}">${p.id===atual?'<span class="selo">SEU PLANO</span>':""}<b style="font-size:1.1rem">${p.nome}</b><div class="preco">${p.preco}<small> /mês</small></div><ul>${p.itens.map(i=>`<li>${i}</li>`).join("")}</ul>
    ${p.id!==atual&&wa?`<a class="btn claro" href="https://wa.me/${wa}?text=${encodeURIComponent(`Olá! Quero mudar a loja ${empresa.nome} para o plano ${p.nome} (${p.preco}/mês).`)}" target="_blank" rel="noopener">Quero o ${p.nome}</a>`:""}</div>`).join("")}`}

document.addEventListener("keydown",e=>{if(e.key==="Escape")fechar()});
if(!DEMO)db.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY")abrirSheet(`<h2 style="margin-top:8px">Criar nova senha</h2><form onsubmit="novaSenha(event)"><label for="nSenha">Nova senha</label><input class="inp" id="nSenha" type="password" minlength="6" required autocomplete="new-password"><button class="btn">Salvar senha</button></form>`)});
async function novaSenha(ev){ev.preventDefault();const {error}=await db.auth.updateUser({password:$("#nSenha").value});fechar();toast(error?traduzErro(error):"✅ Senha alterada!");iniciar()}
iniciar().catch(e=>{$("#main").innerHTML=`<div class="card"><h2>Sem conexão</h2><p class="sub">${esc(traduzErro(e))}</p><button class="btn" onclick="location.reload()">Tentar de novo</button></div>`});
</script>
