<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1428">
<meta name="robots" content="noindex">
<title>Página não encontrada – Vitrine Castro</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<style>
:root{--bg:#FAF6EC;--txt:#0B1A45;--muted:#4A5578}
@media (prefers-color-scheme:dark){:root{--bg:#0B1020;--txt:#ECE6D6;--muted:#AEB5CB}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);font-family:Poppins,system-ui,sans-serif;text-align:center;padding:24px}
h1{font-size:1.6rem;margin:12px 0 6px}p{color:var(--muted)}
a{display:inline-flex;align-items:center;min-height:52px;margin-top:20px;padding:0 24px;border-radius:14px;background:#0E1428;color:#D4A537;font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid #D4A537;outline-offset:2px}
.n{font-size:4rem;font-weight:800;color:#D4A537}
</style>
</head>
<body>
<main>
  <div class="n" aria-hidden="true">404</div>
  <h1>Essa página não existe</h1>
  <p>Talvez a oferta tenha acabado ou o link esteja errado.</p>
  <a href="/">Ver as ofertas de Castro</a>
</main>
</body>
</html>
