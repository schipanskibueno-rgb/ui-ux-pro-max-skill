# Configuração da Netlify. Arraste a pasta inteira no painel (Deploys > arraste aqui).
[build]
  publish = "."

# Cabeçalhos de segurança para TODAS as páginas
[[headers]]
  for = "/*"
  [headers.values]
    # CSP: só deixa carregar scripts do próprio site e das 2 CDNs usadas (com SRI),
    # e só deixa o app conversar com o Supabase. Bloqueia <iframe> de outros sites.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

# Arquivos que NÃO devem ser públicos (o banco e a documentação interna)
[[redirects]]
  from = "/supabase.sql"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/design-system/*"
  to = "/404.html"
  status = 404
  force = true

# HTML, config e service worker: sempre buscar a versão nova
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

# Imagens e ícones: cache de 30 dias
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
